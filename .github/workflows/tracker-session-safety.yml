name: Tracker session safety
on:
  push:
    branches: [fix/tracker-session-safety]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tracker-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund && npm ci --prefix backend/free --no-audit --no-fund && npm install -g firebase-tools@15.34.0 --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test && npm run check
      - name: Verify authoritative writes and actual browser save recovery
        run: |
          mkdir -p test-results/session-safety
          python3 -m http.server 8765 --bind 127.0.0.1 >test-results/session-safety/http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          firebase emulators:exec --project demo-three-patti --only auth,firestore 'node --test --test-concurrency=1 online/test/manual-session-safety.emulator.cjs online/test/tracker-incremental.emulator.cjs && node online/test/manual-safety.browser.cjs && node --test --test-concurrency=1 backend/free/test/tracker-journal.emulator.test.mjs backend/free/test/live-export.emulator.test.mjs' >test-results/session-safety/verification.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-session-safety
          path: test-results/session-safety/
