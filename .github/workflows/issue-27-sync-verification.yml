name: Issue 27 incremental sync safety
on:
  push:
    branches: [issue-27-sync-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npm ci --prefix backend/free && npm install -g firebase-tools@14.17.0
      - run: npx playwright install --with-deps chromium
      - name: Verify unit, browser, engine, exports and rules
        run: |
          mkdir -p test-results/issue-27
          python3 -m http.server 8765 > test-results/issue-27/http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8765/index.html > /dev/null
          npm test > test-results/issue-27/unit.log 2>&1
          npm run check
          npm run build --prefix backend/free
          npm test --prefix backend/free > test-results/issue-27/backend.log 2>&1
          firebase emulators:exec --project demo-three-patti --only auth,firestore 'node --test --test-concurrency=1 online/test/tracker-incremental.emulator.cjs online/test/tracker-cutover.emulator.cjs && node online/test/tracker-auto.browser.cjs && node --test --test-concurrency=1 backend/free/test/tracker-journal.emulator.test.mjs backend/free/test/live-export.emulator.test.mjs backend/free/test/emulator.test.mjs backend/free/test/usage.emulator.test.mjs' > test-results/issue-27/emulator.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-27-sync-evidence
          path: |
            test-results/
            firestore-debug.log
